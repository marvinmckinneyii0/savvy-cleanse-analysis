# SavvyCortex pipeline configuration (Phase 2). Secrets live in .env, NOT here.

data_sources:
  - data/sales.csv            # file path(s) or directory(ies) the agents pull from

report_schedule:
  interval: weekly            # one of: daily | weekly | monthly
  # cron: "0 6 * * 1"         # OR a cron expression (mutually exclusive with interval)

metric_thresholds:            # per-metric fractional change; 0.15 == ±15%
  revenue: 0.15
  units_sold: 0.20

alert_recipients:
  - ops@example.com

output:
  format: docx                # docx | pdf
  output_dir: output/

# Cleaning is optional and off by default. Run
# `python -m backend.pipeline.orchestrator --help` for the working-copy
# disclosure and plain-language descriptions of every missing-value choice.
# The whole section is optional; omitting it leaves cleaning off. An explicit
# CLI --clean or --no-clean selection overrides the `enabled` value below.
# cleaning:
#   enabled: false            # change to true to opt in by default
#   imputation:
#     defaults:               # optional choices by column type
#       numeric: median
#       categorical: mode
#       datetime: forward_fill
#     columns:                # optional: per-column overrides (highest precedence)
#       revenue: median
#       region: leave_as_is
#     # accepted values: mean | median | mode | forward_fill | leave_as_is


# Report charts are analyst-specified only. Omitting this section produces no
# charts and preserves the existing report output. Maximum 12 chart specs.
# visualizations:
#   charts:
#     - chart_type: missing_values_before_after
#       # columns: [revenue, region]   # optional; default is missing columns, capped at 30
#     - chart_type: distribution_before_after
#       column: revenue
#     - chart_type: distribution
#       column: units_sold
#     - chart_type: top_values
#       column: region
#       limit: 10
